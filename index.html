<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Haunted Mansion - Spark VR</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 20;
      padding: 10px 14px;
      background: rgba(0,0,0,0.65);
      border-radius: 8px;
      pointer-events: none;
    }

    #instructions {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 10px 14px;
      background: rgba(0,0,0,0.65);
      border-radius: 8px;
      text-align: center;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.2.0/spark.module.js"
    }
  }
  </script>
</head>

<body>

<div id="status">Chargement du manoir...</div>

<div id="instructions">
  WASD = déplacement • souris = regarder
</div>

<script type="module">

import * as THREE from "three";

import {
  SparkRenderer,
  SplatMesh,
  SparkControls,
  SparkXr
} from "@sparkjsdev/spark";


// --------------------------------------------------
// SCÈNE
// --------------------------------------------------

const scene = new THREE.Scene();


// --------------------------------------------------
// CAMÉRA
// --------------------------------------------------

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);


// --------------------------------------------------
// LOCAL FRAME
//
// C'est notre futur "wagon".
// La caméra est à l'intérieur.
// En VR, le Vision Pro pourra bouger la tête
// indépendamment du déplacement de ce groupe.
// --------------------------------------------------

const localFrame = new THREE.Group();

scene.add(localFrame);

localFrame.add(camera);


// Position initiale du wagon
localFrame.position.set(0, 0, 3);

// Hauteur des yeux
camera.position.set(0, 1.6, 0);


// --------------------------------------------------
// RENDERER THREE
// --------------------------------------------------

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(1);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);


// --------------------------------------------------
// SPARK RENDERER
// --------------------------------------------------

const spark = new SparkRenderer({

  renderer,

  // Réduit légèrement l'étendue rasterisée des
  // Gaussians pour gagner en performance.
  maxStdDev: Math.sqrt(4),

  view: {
    sort360: true,
    sort32: true
  }

});

scene.add(spark);


// --------------------------------------------------
// TON MANOIR
// --------------------------------------------------

const mansion = new SplatMesh({

  url:
    "https://pub-95b1d37c5acf4cec9c0b743e39d67c63.r2.dev/test%20fatHaunted%20Mansion%20Stretching%20Room.spz",

  // IMPORTANT :
  // génération automatique du LOD
  lod: true

});

scene.add(mansion);


// --------------------------------------------------
// CONTRÔLES PC
// --------------------------------------------------

const controls = new SparkControls({
  canvas: renderer.domElement
});

// Souris un peu plus sensible
controls.pointerControls.rotateSpeed *= 2;


// --------------------------------------------------
// WEBXR / VISION PRO
// --------------------------------------------------

const xr = new SparkXr({

  renderer,

  referenceSpaceType: "local-floor",

  frameBufferScaleFactor: 0.7,

  onReady: (supported) => {

    if (supported) {

      document.getElementById("instructions").innerHTML =
        "ENTER VR pour entrer dans le manoir";

    } else {

      document.getElementById("instructions").innerHTML =
        "WASD = déplacement • souris = regarder";

    }

  },

  onEnterXr: () => {

    document.getElementById("status").style.display =
      "none";

    document.getElementById("instructions").style.display =
      "none";

  },

  onExitXr: () => {

    document.getElementById("status").style.display =
      "block";

    document.getElementById("instructions").style.display =
      "block";

  }

});


// --------------------------------------------------
// CHARGEMENT DU SPZ + LOD
// --------------------------------------------------

try {

  await mansion.initialized;

  document.getElementById("status").textContent =
    "Manoir chargé - LOD Spark actif";

} catch (error) {

  console.error(
    "Erreur chargement SPZ :",
    error
  );

  document.getElementById("status").textContent =
    "ERREUR - regarde la Console";

}


// --------------------------------------------------
// RESIZE
// --------------------------------------------------

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// --------------------------------------------------
// BOUCLE
// --------------------------------------------------

let lastTime = performance.now();

renderer.setAnimationLoop((time) => {

  const deltaTime =
    Math.min(
      (time - lastTime) / 1000,
      0.1
    );

  lastTime = time;


  // Hors VR :
  // clavier + souris déplacent le wagon entier.
  //
  // La caméra reste enfant du wagon.
  if (!renderer.xr.isPresenting) {

    controls.update(
      deltaTime,
      localFrame
    );

  }


  renderer.render(
    scene,
    camera
  );

});

</script>

</body>
</html>
