<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Haunted Mansion - Vision Pro VR</title>

<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

canvas {
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#status {
  position:fixed;
  top:15px;
  left:15px;
  z-index:20;
  padding:10px 14px;
  color:white;
  background:rgba(0,0,0,.70);
  border-radius:8px;
  line-height:1.45;
}

#vrButton {
  position:fixed;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  z-index:30;

  padding:16px 28px;
  border:0;
  border-radius:12px;

  font-size:20px;
  font-weight:bold;

  background:white;
  color:black;

  display:none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",

    "@sparkjsdev/spark":
      "https://sparkjs.dev/releases/spark/2.2.0/spark.module.js"
  }
}
</script>
</head>

<body>

<div id="status">
Chargement du manoir...
</div>

<button id="vrButton">
ENTER VR
</button>


<script type="module">

import * as THREE from "three";

import {
  SparkRenderer,
  SplatMesh
} from "@sparkjsdev/spark";


// =====================================================
// SCENE
// =====================================================

const scene = new THREE.Scene();


// =====================================================
// XR RIG = NOTRE WAGON
// =====================================================

const wagon = new THREE.Group();

scene.add(wagon);


// La caméra reste ENFANT du wagon.
//
// WebXR contrôlera la position/orientation
// de la tête à l'intérieur de ce wagon.

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.01,
  2000
);

wagon.add(camera);


// Position initiale du wagon

wagon.position.set(
  0,
  0,
  3
);


// Hors VR seulement,
// hauteur approximative des yeux.

camera.position.set(
  0,
  1.6,
  0
);


// =====================================================
// RENDERER
// =====================================================

const renderer =
  new THREE.WebGLRenderer({

    antialias:false,

    powerPreference:
      "high-performance"

  });


renderer.setPixelRatio(1);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


// IMPORTANT WEBXR

renderer.xr.enabled = true;

renderer.xr.setReferenceSpaceType(
  "local-floor"
);


document.body.appendChild(
  renderer.domElement
);


// =====================================================
// SPARK
// =====================================================

const spark =
  new SparkRenderer({

    renderer,

    maxStdDev:
      Math.sqrt(4)

  });


scene.add(spark);


// =====================================================
// TON SPZ
// =====================================================

const mansion =
  new SplatMesh({

    url:
      "https://pub-95b1d37c5acf4cec9c0b743e39d67c63.r2.dev/test%20fatHaunted%20Mansion%20Stretching%20Room.spz",

    lod:true

  });


scene.add(mansion);


// =====================================================
// STATUS
// =====================================================

const status =
  document.getElementById(
    "status"
  );

const vrButton =
  document.getElementById(
    "vrButton"
  );


let loaded = false;

let gamepadName =
  "aucune";


// =====================================================
// CHARGEMENT SPARK LOD
// =====================================================

try {

  await mansion.initialized;

  loaded = true;

  status.innerHTML =
    "✅ Manoir chargé<br>" +
    "LOD Spark actif";

}

catch(error) {

  console.error(
    "Erreur SPZ:",
    error
  );

  status.textContent =
    "ERREUR SPZ";

}


// =====================================================
// TEST WEBXR
// =====================================================

let xrSupported = false;


if (
  navigator.xr
) {

  try {

    xrSupported =
      await navigator.xr
        .isSessionSupported(
          "immersive-vr"
        );

  }

  catch(error) {

    console.error(
      "Test WebXR:",
      error
    );

  }

}


if (
  xrSupported
) {

  vrButton.style.display =
    "block";

}

else {

  status.innerHTML +=
    "<br>❌ immersive-vr indisponible";

}


// =====================================================
// ENTER VR
// =====================================================

vrButton.addEventListener(
  "click",
  async () => {

    try {

      const session =
        await navigator.xr.requestSession(
          "immersive-vr",
          {
            optionalFeatures:[
              "local-floor",
              "bounded-floor",
              "hand-tracking"
            ]
          }
        );


      renderer.xr.setSession(
        session
      );


      vrButton.style.display =
        "none";


      status.innerHTML =
        "🥽 VR active";


      session.addEventListener(
        "end",
        () => {

          vrButton.style.display =
            "block";

        }
      );

    }

    catch(error) {

      console.error(
        "ENTER VR:",
        error
      );

      status.innerHTML =
        "❌ Impossible d'entrer en VR";

    }

  }
);


// =====================================================
// XBOX / GAMEPAD
// =====================================================

function deadzone(
  value,
  threshold = 0.16
) {

  if (
    Math.abs(value) <
    threshold
  ) {

    return 0;

  }

  return value;

}


function findGamepad() {

  if (
    !navigator.getGamepads
  ) {

    return null;

  }


  const pads =
    navigator.getGamepads();


  for (
    const pad of pads
  ) {

    if (
      pad &&
      pad.connected
    ) {

      return pad;

    }

  }


  return null;

}


// =====================================================
// MOUVEMENT DU WAGON
// =====================================================

function updateXbox(
  dt
) {

  const pad =
    findGamepad();


  if (
    !pad
  ) {

    gamepadName =
      "aucune";

    return;

  }


  gamepadName =
    pad.id ||
    "Gamepad";


  // Xbox standard :
  //
  // axes 0 = stick gauche X
  // axes 1 = stick gauche Y
  //
  // axes 2 = stick droit X
  // axes 3 = stick droit Y


  const lx =
    deadzone(
      pad.axes[0] || 0
    );


  const ly =
    deadzone(
      pad.axes[1] || 0
    );


  const rx =
    deadzone(
      pad.axes[2] || 0
    );


  // ===================================================
  // VITESSE
  // ===================================================

  let speed =
    2.0;


  // gâchette droite =
  // déplacement rapide

  if (
    pad.buttons[7] &&
    pad.buttons[7].value > 0.20
  ) {

    speed =
      6.0;

  }


  // ===================================================
  // ROTATION DU WAGON
  //
  // IMPORTANT :
  //
  // On ne tourne PAS la caméra XR.
  //
  // Le stick droit tourne uniquement
  // le wagon.
  //
  // Ta tête reste totalement libre.
  // ===================================================

  wagon.rotation.y -=
    rx *
    1.5 *
    dt;


  // ===================================================
  // DIRECTIONS DU WAGON
  // ===================================================

  const yaw =
    wagon.rotation.y;


  const forward =
    new THREE.Vector3(

      -Math.sin(yaw),

      0,

      -Math.cos(yaw)

    );


  const right =
    new THREE.Vector3(

      Math.cos(yaw),

      0,

      -Math.sin(yaw)

    );


  // Stick gauche vertical =
  // avant / arrière

  wagon.position.addScaledVector(

    forward,

    -ly *
    speed *
    dt

  );


  // Stick gauche horizontal =
  // déplacement latéral

  wagon.position.addScaledVector(

    right,

    lx *
    speed *
    dt

  );


  // ===================================================
  // BOUTONS LB / RB
  //
  // Pour le diagnostic :
  //
  // LB = descendre
  // RB = monter
  // ===================================================

  if (
    pad.buttons[4] &&
    pad.buttons[4].pressed
  ) {

    wagon.position.y -=
      speed *
      dt;

  }


  if (
    pad.buttons[5] &&
    pad.buttons[5].pressed
  ) {

    wagon.position.y +=
      speed *
      dt;

  }

}


// =====================================================
// DEBUG HORS VR
// =====================================================

function updateStatus() {

  if (
    renderer.xr.isPresenting
  ) {

    return;

  }


  const p =
    wagon.position;


  status.innerHTML =

    (loaded
      ? "✅ Manoir + LOD actif"
      : "⏳ LOD en construction")

    +

    "<br>🎮 " +
    gamepadName

    +

    "<br>Wagon : "

    +

    p.x.toFixed(2) +
    " / " +

    p.y.toFixed(2) +
    " / " +

    p.z.toFixed(2);

}


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }
);


// =====================================================
// BOUCLE PRINCIPALE
// =====================================================

const clock =
  new THREE.Clock();


renderer.setAnimationLoop(
  () => {

    const dt =
      Math.min(
        clock.getDelta(),
        0.05
      );


    // Xbox fonctionne aussi
    // pendant la session Vision Pro.

    updateXbox(
      dt
    );


    updateStatus();


    renderer.render(
      scene,
      camera
    );

  }
);

</script>

</body>
</html>
