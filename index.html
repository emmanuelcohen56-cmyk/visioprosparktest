<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Haunted Mansion - Spark VR</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#status {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 20;
  padding: 10px 14px;
  color: white;
  background: rgba(0,0,0,.72);
  border-radius: 8px;
  line-height: 1.45;
  pointer-events: none;
}

#help {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 10px 14px;
  color: white;
  background: rgba(0,0,0,.72);
  border-radius: 8px;
  text-align: center;
  pointer-events: none;
}

#vrButton {
  position: fixed;
  right: 25px;
  bottom: 25px;
  z-index: 30;
  padding: 16px 28px;
  border: 0;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  background: white;
  color: black;
  display: none;
}

#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 6px;
  margin-left: -3px;
  margin-top: -3px;
  border-radius: 50%;
  background: white;
  z-index: 20;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",

    "@sparkjsdev/spark":
      "https://sparkjs.dev/releases/spark/2.2.0/spark.module.js"
  }
}
</script>
</head>

<body>

<div id="status">Chargement du manoir...</div>

<div id="help">
  PC : ZQSD / WASD • souris : clic + glisser • Shift : rapide<br>
  Xbox : stick gauche = déplacement • stick droit = tourner • RT = rapide
</div>

<div id="crosshair"></div>

<button id="vrButton">ENTER VR</button>


<script type="module">

import * as THREE from "three";

import {
  SparkRenderer,
  SplatMesh
} from "@sparkjsdev/spark";


// ======================================================
// SCÈNE
// ======================================================

const scene = new THREE.Scene();


// ======================================================
// WAGON / XR RIG
//
// Tout le déplacement se fait avec ce groupe.
// La caméra reste enfant du wagon.
//
// En VR :
// le wagon se déplace,
// mais le Vision Pro garde le contrôle de la tête.
// ======================================================

const wagon = new THREE.Group();

scene.add(wagon);


const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.01,
  2000
);


wagon.add(camera);


// Position de départ

wagon.position.set(
  0,
  0,
  3
);


// Hauteur PC hors VR

camera.position.set(
  0,
  1.6,
  0
);


// Orientation du wagon / regard PC

let yaw = 0;
let pitch = 0;


// ======================================================
// RENDERER
// ======================================================

const renderer = new THREE.WebGLRenderer({

  antialias: false,

  powerPreference:
    "high-performance"

});


renderer.setPixelRatio(1);


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


// WebXR

renderer.xr.enabled = true;


renderer.xr.setReferenceSpaceType(
  "local-floor"
);


document.body.appendChild(
  renderer.domElement
);


// ======================================================
// SPARK
// ======================================================

const spark = new SparkRenderer({

  renderer,

  maxStdDev:
    Math.sqrt(4)

});


scene.add(spark);


// ======================================================
// MANOIR SPZ + LOD
// ======================================================

const mansion = new SplatMesh({

  url:
    "https://pub-95b1d37c5acf4cec9c0b743e39d67c63.r2.dev/test%20fatHaunted%20Mansion%20Stretching%20Room.spz",

  lod: true

});


scene.add(mansion);


// ======================================================
// ORIENTATION DU MONDE
//
// IMPORTANT :
// je ne force PLUS ici X/Z/Y à 180°,
// puisque les essais précédents n'ont pas résolu
// correctement ton inversion.
//
// On corrigera UNIQUEMENT ces 3 valeurs
// après avoir confirmé les contrôles.
//
// 0 = aucune rotation.
// ======================================================

const WORLD_ROTATION_X = 0;
const WORLD_ROTATION_Y = 0;
const WORLD_ROTATION_Z = 0;


mansion.rotation.set(

  THREE.MathUtils.degToRad(
    WORLD_ROTATION_X
  ),

  THREE.MathUtils.degToRad(
    WORLD_ROTATION_Y
  ),

  THREE.MathUtils.degToRad(
    WORLD_ROTATION_Z
  )

);


// ======================================================
// INTERFACE
// ======================================================

const status =
  document.getElementById(
    "status"
  );


const help =
  document.getElementById(
    "help"
  );


const vrButton =
  document.getElementById(
    "vrButton"
  );


const crosshair =
  document.getElementById(
    "crosshair"
  );


let loaded = false;

let gamepadName =
  "aucune";


// ======================================================
// CLAVIER
// ======================================================

const keys = {};


window.addEventListener(
  "keydown",
  (event) => {

    keys[event.code] = true;


    if (
      event.code.startsWith(
        "Arrow"
      )
    ) {

      event.preventDefault();

    }

  }
);


window.addEventListener(
  "keyup",
  (event) => {

    keys[event.code] = false;

  }
);


// ======================================================
// SOURIS + TACTILE
//
// C'est le système clic-glissé de la version
// qui fonctionnait chez toi.
// ======================================================

let dragging = false;

let lastX = 0;
let lastY = 0;


renderer.domElement.addEventListener(
  "pointerdown",
  (event) => {

    // En VR, on laisse WebXR gérer.
    if (
      renderer.xr.isPresenting
    ) {
      return;
    }


    dragging = true;

    lastX =
      event.clientX;

    lastY =
      event.clientY;


    try {

      renderer.domElement
        .setPointerCapture(
          event.pointerId
        );

    }

    catch {}

  }
);


renderer.domElement.addEventListener(
  "pointerup",
  (event) => {

    dragging = false;


    try {

      renderer.domElement
        .releasePointerCapture(
          event.pointerId
        );

    }

    catch {}

  }
);


renderer.domElement.addEventListener(
  "pointercancel",
  () => {

    dragging = false;

  }
);


renderer.domElement.addEventListener(
  "pointermove",
  (event) => {

    if (
      !dragging ||
      renderer.xr.isPresenting
    ) {

      return;

    }


    const dx =
      event.clientX -
      lastX;


    const dy =
      event.clientY -
      lastY;


    lastX =
      event.clientX;


    lastY =
      event.clientY;


    yaw -=
      dx * 0.004;


    pitch -=
      dy * 0.004;


    pitch =
      THREE.MathUtils.clamp(

        pitch,

        -1.45,

        1.45

      );

  }
);


// ======================================================
// XBOX / GAMEPAD
// ======================================================

function deadzone(
  value,
  threshold = 0.16
) {

  if (
    Math.abs(value) <
    threshold
  ) {

    return 0;

  }


  return value;

}


function findGamepad() {

  if (
    !navigator.getGamepads
  ) {

    return null;

  }


  const pads =
    navigator.getGamepads();


  for (
    const pad of pads
  ) {

    if (
      pad &&
      pad.connected
    ) {

      return pad;

    }

  }


  return null;

}


window.addEventListener(
  "gamepadconnected",
  (event) => {

    gamepadName =
      event.gamepad.id ||
      "Gamepad";


    console.log(
      "Xbox/Gamepad connecté:",
      gamepadName
    );

  }
);


window.addEventListener(
  "gamepaddisconnected",
  () => {

    gamepadName =
      "aucune";

  }
);


// ======================================================
// CHARGEMENT SPZ + LOD
// ======================================================

try {

  await mansion.initialized;


  loaded = true;


  status.innerHTML =
    "✅ Manoir chargé<br>" +
    "LOD Spark actif";

}

catch(error) {

  console.error(
    "Erreur SPZ:",
    error
  );


  status.innerHTML =
    "❌ ERREUR SPZ";

}


// ======================================================
// WEBXR
// ======================================================

let xrSupported = false;


if (
  navigator.xr
) {

  try {

    xrSupported =

      await navigator.xr
        .isSessionSupported(
          "immersive-vr"
        );

  }

  catch(error) {

    console.error(
      "Détection WebXR:",
      error
    );

  }

}


if (
  xrSupported
) {

  vrButton.style.display =
    "block";

}

else {

  console.log(
    "immersive-vr non disponible sur cet appareil"
  );

}


// ======================================================
// ENTER VR
// ======================================================

vrButton.addEventListener(
  "click",
  async () => {

    try {

      const session =

        await navigator.xr
          .requestSession(
            "immersive-vr",
            {

              optionalFeatures: [

                "local-floor",

                "bounded-floor",

                "hand-tracking"

              ]

            }
          );


      await renderer.xr
        .setSession(
          session
        );


      vrButton.style.display =
        "none";


      status.style.display =
        "none";


      help.style.display =
        "none";


      crosshair.style.display =
        "none";


      session.addEventListener(
        "end",
        () => {

          status.style.display =
            "block";


          help.style.display =
            "block";


          crosshair.style.display =
            "block";


          if (
            xrSupported
          ) {

            vrButton.style.display =
              "block";

          }

        }
      );

    }

    catch(error) {

      console.error(
        "Erreur ENTER VR:",
        error
      );


      status.innerHTML =
        "❌ Impossible d'entrer en VR";

    }

  }
);


// ======================================================
// DÉPLACEMENT
//
// PC + Xbox utilisent exactement le même wagon.
// ======================================================

function updateMovement(
  deltaTime
) {

  let forwardInput = 0;

  let sideInput = 0;

  let verticalInput = 0;

  let turnInput = 0;


  let speed = 2.5;


  // ----------------------------------------------------
  // CLAVIER AZERTY + QWERTY
  // ----------------------------------------------------

  if (

    keys["KeyW"] ||

    keys["KeyZ"] ||

    keys["ArrowUp"]

  ) {

    forwardInput += 1;

  }


  if (

    keys["KeyS"] ||

    keys["ArrowDown"]

  ) {

    forwardInput -= 1;

  }


  if (

    keys["KeyA"] ||

    keys["KeyQ"] ||

    keys["ArrowLeft"]

  ) {

    sideInput -= 1;

  }


  if (

    keys["KeyD"] ||

    keys["ArrowRight"]

  ) {

    sideInput += 1;

  }


  // Monter

  if (
    keys["KeyE"]
  ) {

    verticalInput += 1;

  }


  // Descendre

  if (
    keys["KeyC"]
  ) {

    verticalInput -= 1;

  }


  // Sprint

  if (

    keys["ShiftLeft"] ||

    keys["ShiftRight"]

  ) {

    speed = 7;

  }


  // ----------------------------------------------------
  // XBOX
  // ----------------------------------------------------

  const pad =
    findGamepad();


  if (
    pad
  ) {

    gamepadName =
      pad.id ||
      "Gamepad";


    // Stick gauche

    const leftX =
      deadzone(
        pad.axes[0] || 0
      );


    const leftY =
      deadzone(
        pad.axes[1] || 0
      );


    // Stick droit horizontal

    const rightX =
      deadzone(
        pad.axes[2] || 0
      );


    sideInput +=
      leftX;


    forwardInput +=
      -leftY;


    turnInput +=
      rightX;


    // RT = rapide

    if (

      pad.buttons[7] &&

      pad.buttons[7].value >
      0.20

    ) {

      speed = 7;

    }


    // LB = descendre

    if (

      pad.buttons[4] &&

      pad.buttons[4].pressed

    ) {

      verticalInput -= 1;

    }


    // RB = monter

    if (

      pad.buttons[5] &&

      pad.buttons[5].pressed

    ) {

      verticalInput += 1;

    }

  }

  else {

    gamepadName =
      "aucune";

  }


  // ----------------------------------------------------
  // ROTATION HORIZONTALE DU WAGON
  //
  // Souris PC modifie déjà yaw.
  // Xbox ajoute turnInput.
  //
  // En VR :
  // le Vision Pro garde son tracking de tête.
  // ----------------------------------------------------

  yaw -=

    turnInput *

    1.7 *

    deltaTime;


  wagon.rotation.y =
    yaw;


  // Regard vertical PC uniquement.
  //
  // NE PAS imposer cette rotation
  // pendant une session XR.

  if (
    !renderer.xr.isPresenting
  ) {

    camera.rotation.x =
      pitch;

  }


  // ----------------------------------------------------
  // DIRECTION DU WAGON
  // ----------------------------------------------------

  const forward =
    new THREE.Vector3(

      -Math.sin(yaw),

      0,

      -Math.cos(yaw)

    );


  const right =
    new THREE.Vector3(

      Math.cos(yaw),

      0,

      -Math.sin(yaw)

    );


  wagon.position
    .addScaledVector(

      forward,

      forwardInput *
      speed *
      deltaTime

    );


  wagon.position
    .addScaledVector(

      right,

      sideInput *
      speed *
      deltaTime

    );


  wagon.position.y +=

    verticalInput *

    speed *

    deltaTime;

}


// ======================================================
// DEBUG / COORDONNÉES
//
// Très utile ensuite pour poser les points du rail.
// ======================================================

function updateStatus() {

  if (
    renderer.xr.isPresenting
  ) {

    return;

  }


  const position =
    wagon.position;


  status.innerHTML =

    (
      loaded

      ? "✅ Manoir + LOD actif"

      : "⏳ Construction LOD..."
    )

    +

    "<br>🎮 Xbox : " +
    gamepadName

    +

    "<br>📍 X " +
    position.x.toFixed(2)

    +

    " Y " +
    position.y.toFixed(2)

    +

    " Z " +
    position.z.toFixed(2)

    +

    "<br>↻ Yaw " +
    THREE.MathUtils
      .radToDeg(yaw)
      .toFixed(1) +
    "°";

}


// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =

      window.innerWidth /

      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }
);


// ======================================================
// RENDER LOOP
// ======================================================

const clock =
  new THREE.Clock();


renderer.setAnimationLoop(
  () => {

    const deltaTime =

      Math.min(

        clock.getDelta(),

        0.05

      );


    updateMovement(
      deltaTime
    );


    updateStatus();


    renderer.render(

      scene,

      camera

    );

  }
);

</script>

</body>
</html>
