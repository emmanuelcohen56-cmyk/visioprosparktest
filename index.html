<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>Haunted Mansion - Spark VR</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 20;
      padding: 10px 14px;
      background: rgba(0,0,0,.7);
      border-radius: 8px;
      pointer-events: none;
    }

    #help {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 12px 16px;
      background: rgba(0,0,0,.7);
      border-radius: 8px;
      text-align: center;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 50%;
      background: white;
      z-index: 20;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",

      "@sparkjsdev/spark":
        "https://sparkjs.dev/releases/spark/2.2.0/spark.module.js"
    }
  }
  </script>
</head>

<body>

<div id="status">Chargement du manoir...</div>

<div id="help">
  Clique dans l'image<br>
  WASD = déplacement • Souris = regarder • Shift = rapide
</div>

<div id="crosshair"></div>

<script type="module">

import * as THREE from "three";

import {
  SparkRenderer,
  SplatMesh
} from "@sparkjsdev/spark";

import {
  PointerLockControls
} from "three/addons/controls/PointerLockControls.js";


// ======================================================
// SCENE
// ======================================================

const scene = new THREE.Scene();


// ======================================================
// CAMERA
// ======================================================

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);


// ======================================================
// FUTUR WAGON / XR RIG
// ======================================================

const localFrame = new THREE.Group();

scene.add(localFrame);

localFrame.add(camera);


// Position de départ

localFrame.position.set(
  0,
  0,
  3
);


// Hauteur des yeux

camera.position.set(
  0,
  1.6,
  0
);


// ======================================================
// RENDERER
// ======================================================

const renderer = new THREE.WebGLRenderer({

  antialias: false,

  powerPreference:
    "high-performance"

});

renderer.setPixelRatio(1);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
  renderer.domElement
);


// ======================================================
// SPARK
// ======================================================

const spark = new SparkRenderer({

  renderer

});

scene.add(spark);


// ======================================================
// TON MANOIR SPZ + LOD
// ======================================================

const mansion = new SplatMesh({

  url:
    "https://pub-95b1d37c5acf4cec9c0b743e39d67c63.r2.dev/test%20fatHaunted%20Mansion%20Stretching%20Room.spz",

  lod: true

});

scene.add(mansion);


// ======================================================
// SOURIS
// ======================================================

const controls =
  new PointerLockControls(
    camera,
    renderer.domElement
  );


// Un clic dans l'image capture la souris

renderer.domElement.addEventListener(
  "click",
  () => {

    if (!renderer.xr.isPresenting) {
      controls.lock();
    }

  }
);


controls.addEventListener(
  "lock",
  () => {

    document.getElementById(
      "help"
    ).style.display = "none";

  }
);


controls.addEventListener(
  "unlock",
  () => {

    document.getElementById(
      "help"
    ).style.display = "block";

  }
);


// ======================================================
// CLAVIER
// ======================================================

const keys = {};

window.addEventListener(
  "keydown",
  (event) => {

    keys[
      event.code
    ] = true;

  }
);


window.addEventListener(
  "keyup",
  (event) => {

    keys[
      event.code
    ] = false;

  }
);


// ======================================================
// CHARGEMENT
// ======================================================

try {

  await mansion.initialized;

  document.getElementById(
    "status"
  ).textContent =
    "Manoir chargé - LOD Spark actif";

}

catch (error) {

  console.error(
    "Erreur SPZ :",
    error
  );

  document.getElementById(
    "status"
  ).textContent =
    "ERREUR - regarde la Console";

}


// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ======================================================
// DEPLACEMENT
// ======================================================

const clock =
  new THREE.Clock();


function updateMovement(delta) {

  if (
    renderer.xr.isPresenting
  ) {
    return;
  }


  let speed = 2.5;


  if (
    keys["ShiftLeft"] ||
    keys["ShiftRight"]
  ) {

    speed = 7;

  }


  const distance =
    speed * delta;


  // Direction horizontale
  // basée sur l'orientation de la caméra

  const forward =
    new THREE.Vector3();

  camera.getWorldDirection(
    forward
  );

  forward.y = 0;

  forward.normalize();


  const right =
    new THREE.Vector3();

  right.crossVectors(
    forward,
    camera.up
  );

  right.normalize();


  // W / Z / flèche haut

  if (
    keys["KeyW"] ||
    keys["KeyZ"] ||
    keys["ArrowUp"]
  ) {

    localFrame.position.addScaledVector(
      forward,
      distance
    );

  }


  // S / flèche bas

  if (
    keys["KeyS"] ||
    keys["ArrowDown"]
  ) {

    localFrame.position.addScaledVector(
      forward,
      -distance
    );

  }


  // A / Q / flèche gauche

  if (
    keys["KeyA"] ||
    keys["KeyQ"] ||
    keys["ArrowLeft"]
  ) {

    localFrame.position.addScaledVector(
      right,
      -distance
    );

  }


  // D / flèche droite

  if (
    keys["KeyD"] ||
    keys["ArrowRight"]
  ) {

    localFrame.position.addScaledVector(
      right,
      distance
    );

  }


  // E = monter

  if (
    keys["KeyE"]
  ) {

    localFrame.position.y +=
      distance;

  }


  // C = descendre

  if (
    keys["KeyC"]
  ) {

    localFrame.position.y -=
      distance;

  }

}


// ======================================================
// RENDER LOOP
// ======================================================

renderer.setAnimationLoop(
  () => {

    const delta =
      Math.min(
        clock.getDelta(),
        0.05
      );


    updateMovement(
      delta
    );


    renderer.render(
      scene,
      camera
    );

  }
);

</script>

</body>
</html>
