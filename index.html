<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Haunted Mansion - Spark VR</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#status {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 20;
  padding: 10px 14px;
  color: white;
  background: rgba(0,0,0,.70);
  border-radius: 8px;
  line-height: 1.45;
  pointer-events: none;
}

#help {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 9px 14px;
  color: white;
  background: rgba(0,0,0,.70);
  border-radius: 8px;
  text-align: center;
  pointer-events: none;
}

#vrButton {
  position: fixed;
  right: 25px;
  bottom: 25px;
  z-index: 30;
  padding: 16px 28px;
  border: 0;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  background: white;
  color: black;
  display: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.2.0/spark.module.js"
  }
}
</script>
</head>

<body>

<div id="status">Chargement du manoir...</div>

<div id="help">
  PC : ZQSD/WASD • clic + glisser • Shift = rapide<br>
  Xbox : stick gauche = déplacement • stick droit = rotation
</div>

<button id="vrButton">ENTER VR</button>

<script type="module">

import * as THREE from "three";

import {
  SparkRenderer,
  SplatMesh
} from "@sparkjsdev/spark";


// =====================================================
// SCÈNE
// =====================================================

const scene = new THREE.Scene();


// =====================================================
// WAGON / XR RIG
// =====================================================

const wagon = new THREE.Group();
scene.add(wagon);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.01,
  2000
);

wagon.add(camera);

wagon.position.set(0, 0, 3);

// Hauteur des yeux hors VR
camera.position.set(0, 1.6, 0);

let yaw = 0;
let pitch = 0;


// =====================================================
// RENDERER
// =====================================================

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(1);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.xr.enabled = true;

renderer.xr.setReferenceSpaceType(
  "local-floor"
);

document.body.appendChild(
  renderer.domElement
);


// =====================================================
// SPARK
// =====================================================

const spark = new SparkRenderer({
  renderer,
  maxStdDev: Math.sqrt(4)
});

scene.add(spark);


// =====================================================
// MANOIR + LOD
// =====================================================

const mansion = new SplatMesh({

  url:
    "https://pub-95b1d37c5acf4cec9c0b743e39d67c63.r2.dev/test%20fatHaunted%20Mansion%20Stretching%20Room.spz",

  lod: true

});

scene.add(mansion);


// =====================================================
// ORIENTATION DU MANOIR
//
// IMPORTANT :
// l'export est inversé haut/bas.
// Rotation de 180° autour de Z.
//
// NE PAS ajouter rotation.x = Math.PI.
// =====================================================

mansion.rotation.set(
  0,
  0,
  Math.PI
);


// =====================================================
// INTERFACE
// =====================================================

const status =
  document.getElementById("status");

const help =
  document.getElementById("help");

const vrButton =
  document.getElementById("vrButton");

let loaded = false;
let gamepadName = "aucune";


// =====================================================
// CLAVIER
// =====================================================

const keys = {};

window.addEventListener(
  "keydown",
  (e) => {

    keys[e.code] = true;

    if (e.code.startsWith("Arrow")) {
      e.preventDefault();
    }

  }
);

window.addEventListener(
  "keyup",
  (e) => {

    keys[e.code] = false;

  }
);


// =====================================================
// SOURIS / TACTILE
// =====================================================

let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener(
  "pointerdown",
  (e) => {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

    renderer.domElement.setPointerCapture(
      e.pointerId
    );

  }
);

renderer.domElement.addEventListener(
  "pointerup",
  (e) => {

    dragging = false;

    try {

      renderer.domElement.releasePointerCapture(
        e.pointerId
      );

    } catch {}

  }
);

renderer.domElement.addEventListener(
  "pointermove",
  (e) => {

    if (!dragging) return;

    const dx =
      e.clientX - lastX;

    const dy =
      e.clientY - lastY;

    lastX = e.clientX;
    lastY = e.clientY;

    yaw -= dx * 0.004;
    pitch -= dy * 0.004;

    pitch = THREE.MathUtils.clamp(
      pitch,
      -1.45,
      1.45
    );

  }
);


// =====================================================
// GAMEPAD
// =====================================================

function deadzone(
  value,
  threshold = 0.16
) {

  return Math.abs(value) < threshold
    ? 0
    : value;

}


function findGamepad() {

  if (!navigator.getGamepads) {
    return null;
  }

  const pads =
    navigator.getGamepads();

  for (const pad of pads) {

    if (pad && pad.connected) {
      return pad;
    }

  }

  return null;

}


// =====================================================
// CHARGEMENT
// =====================================================

try {

  await mansion.initialized;

  loaded = true;

  status.innerHTML =
    "✅ Manoir chargé<br>LOD Spark actif";

}

catch(error) {

  console.error(
    "Erreur SPZ:",
    error
  );

  status.innerHTML =
    "❌ ERREUR SPZ";

}


// =====================================================
// WEBXR
// =====================================================

let xrSupported = false;

if (navigator.xr) {

  try {

    xrSupported =
      await navigator.xr.isSessionSupported(
        "immersive-vr"
      );

  }

  catch(error) {

    console.error(
      "WebXR:",
      error
    );

  }

}


if (xrSupported) {

  vrButton.style.display =
    "block";

}


// =====================================================
// ENTER VR
// =====================================================

vrButton.addEventListener(
  "click",
  async () => {

    try {

      const session =
        await navigator.xr.requestSession(
          "immersive-vr",
          {
            optionalFeatures: [
              "local-floor",
              "bounded-floor",
              "hand-tracking"
            ]
          }
        );

      await renderer.xr.setSession(
        session
      );

      vrButton.style.display =
        "none";

      status.style.display =
        "none";

      help.style.display =
        "none";


      session.addEventListener(
        "end",
        () => {

          status.style.display =
            "block";

          help.style.display =
            "block";

          vrButton.style.display =
            "block";

        }
      );

    }

    catch(error) {

      console.error(
        "ENTER VR:",
        error
      );

      status.innerHTML =
        "❌ Impossible d'entrer en VR";

    }

  }
);


// =====================================================
// DÉPLACEMENT
// =====================================================

function updateMovement(dt) {

  let forwardInput = 0;
  let sideInput = 0;
  let verticalInput = 0;
  let turnInput = 0;

  let speed = 2.5;


  // -------------------------
  // CLAVIER
  // -------------------------

  if (
    keys["KeyW"] ||
    keys["KeyZ"] ||
    keys["ArrowUp"]
  ) {

    forwardInput += 1;

  }


  if (
    keys["KeyS"] ||
    keys["ArrowDown"]
  ) {

    forwardInput -= 1;

  }


  if (
    keys["KeyA"] ||
    keys["KeyQ"] ||
    keys["ArrowLeft"]
  ) {

    sideInput -= 1;

  }


  if (
    keys["KeyD"] ||
    keys["ArrowRight"]
  ) {

    sideInput += 1;

  }


  if (keys["KeyE"]) {

    verticalInput += 1;

  }


  if (keys["KeyC"]) {

    verticalInput -= 1;

  }


  if (
    keys["ShiftLeft"] ||
    keys["ShiftRight"]
  ) {

    speed = 7;

  }


  // -------------------------
  // XBOX
  // -------------------------

  const pad =
    findGamepad();


  if (pad) {

    gamepadName =
      pad.id || "Gamepad";


    const lx =
      deadzone(
        pad.axes[0] || 0
      );


    const ly =
      deadzone(
        pad.axes[1] || 0
      );


    const rx =
      deadzone(
        pad.axes[2] || 0
      );


    sideInput += lx;

    forwardInput += -ly;

    turnInput += rx;


    // gâchette droite = rapide

    if (
      pad.buttons[7] &&
      pad.buttons[7].value > 0.20
    ) {

      speed = 7;

    }


    // LB = descendre

    if (
      pad.buttons[4] &&
      pad.buttons[4].pressed
    ) {

      verticalInput -= 1;

    }


    // RB = monter

    if (
      pad.buttons[5] &&
      pad.buttons[5].pressed
    ) {

      verticalInput += 1;

    }

  }

  else {

    gamepadName =
      "aucune";

  }


  // -------------------------
  // ROTATION DU WAGON
  // -------------------------

  yaw -=
    turnInput *
    1.7 *
    dt;


  wagon.rotation.y =
    yaw;


  // Souris verticale uniquement hors VR.
  // En VR : le Vision Pro contrôle la tête.

  if (!renderer.xr.isPresenting) {

    camera.rotation.x =
      pitch;

  }


  // -------------------------
  // DIRECTION
  // -------------------------

  const forward =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );


  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  wagon.position.addScaledVector(
    forward,
    forwardInput *
    speed *
    dt
  );


  wagon.position.addScaledVector(
    right,
    sideInput *
    speed *
    dt
  );


  wagon.position.y +=
    verticalInput *
    speed *
    dt;

}


// =====================================================
// STATUS HORS VR
// =====================================================

function updateStatus() {

  if (renderer.xr.isPresenting) {
    return;
  }


  const p =
    wagon.position;


  status.innerHTML =

    (loaded
      ? "✅ Manoir + LOD actif"
      : "⏳ Construction LOD...")

    +

    "<br>🎮 Xbox : " +
    gamepadName

    +

    "<br>📍 X " +
    p.x.toFixed(2)

    +

    " Y " +
    p.y.toFixed(2)

    +

    " Z " +
    p.z.toFixed(2);

}


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// =====================================================
// RENDER LOOP
// =====================================================

const clock =
  new THREE.Clock();


renderer.setAnimationLoop(
  () => {

    const dt =
      Math.min(
        clock.getDelta(),
        0.05
      );


    updateMovement(dt);

    updateStatus();


    renderer.render(
      scene,
      camera
    );

  }
);

</script>

</body>
</html>
